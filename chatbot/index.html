<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Assistant</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      // 페인트 전에 테마 적용 (깜빡임 방지)
      (function () {
        var t;
        try {
          t = localStorage.getItem("n8n-chat-theme");
        } catch (e) {}
        if (!t)
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="chat-app">
      <header class="chat-header">
        <div class="chat-header__avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M11 3l1.5 4L17 8.5 12.5 10 11 14 9.5 10 5 8.5 9.5 7 11 3z" />
            <path d="M18 13l.8 2.2L21 16l-2.2.8L18 19l-.8-2.2L15 16l2.2-.8L18 13z" />
          </svg>
        </div>
        <div class="chat-header__meta">
          <span class="chat-header__title">Assistant</span>
          <span class="chat-header__status" id="status">온라인</span>
        </div>
        <div class="chat-header__actions">
          <button id="theme-toggle" class="icon-btn" title="테마 전환" aria-label="테마 전환">
            <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19" />
            </svg>
          </button>
          <button id="reset-btn" class="icon-btn" title="대화 초기화" aria-label="대화 초기화">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" />
            </svg>
          </button>
        </div>
      </header>

      <main class="chat-messages" id="messages" aria-live="polite"></main>

      <form class="chat-input" id="chat-form">
        <textarea
          id="input"
          class="chat-input__field"
          rows="1"
          placeholder="메시지를 입력하세요…"
          autocomplete="off"
        ></textarea>
        <button type="submit" id="send-btn" class="chat-input__send" aria-label="보내기">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
          </svg>
        </button>
      </form>
    </div>

    <!-- 마크다운 렌더링 + XSS 방지 (없어도 평문으로 동작) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
